name: C/C++ CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Compilar o programa principal
      run: gcc potencia.c -o potencia

    - name: Executar o programa principal
      run: ./potencia 5 2

    - name: mostrar o conteudo do arquivo criado
      run: cat potencia.txt

    - name: Compilar os testes
      run: gcc testes.c -o testes

    - name: Executar os testes
      run: ./testes
